<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLens  - GitHub Profile Analyzer </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>DevLens</h1>
        <p>Explore GitHub profiles in one place.</p>

        <div class="search-box">
            <input
                type="text"
                id="username"
                placeholder="Enter GitHub username"
            >

            <button id="searchBtn">Analyze Profile</button>
        </div>


<div id="profile">
    <!-- GitHub profile information will appear here -->
</div>


    </div>

    <script src="script.js"></script>
</body>

</html>
